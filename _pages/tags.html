---
title: "Tags"
layout: default
permalink: "/tags.html"
---
<div class="wrap">
    <div class="page">
        <h1 class="page-title">Tags</h1>
        {% for tag in site.tags %}
        <section class="taxonomy-group">
            <h2 id="{{ tag[0] | downcase }}">{{ tag[0] }}</h2>
            <div class="post-list">
                {% for post in tag[1] %}
                    {% include main-loop-card.html %}
                {% endfor %}
            </div>
        </section>
        {% endfor %}
    </div>
</div>
