---
layout: default
---
<div class="wrap">
    <div class="page">
        <h1 class="page-title">{{ page.title }}</h1>
        {% if page.image %}
        <img class="page-hero" src="{% if page.image contains '://' %}{{ page.image }}{% else %}{{ page.image | relative_url }}{% endif %}" alt="{{ page.title }}">
        {% endif %}
        <div class="page-content">
            {{ content }}
            {% if page.comments == true and site.disqus %}
                {% include comments.html %}
            {% endif %}
        </div>
    </div>
</div>
