<article class="post-item">
    <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
    <p class="excerpt">{{ post.excerpt | strip_html | strip_newlines | truncate: 170 }}</p>
    <div class="byline">
        <span>{{ post.date | date: "%b %-d, %Y" }}</span>
        {% if post.categories.size > 0 %}
        <span class="sep">·</span>
        <span>
            {% for category in post.categories %}<a href="{{ '/categories.html' | relative_url }}#{{ category | downcase }}">{{ category }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}
        </span>
        {% endif %}
    </div>
</article>
